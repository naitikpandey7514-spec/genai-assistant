
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NikAI Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            🤖 <span>GenAI</span>
        </div>


        <button
            type="button"
            class="new-chat"
            id="newChatButton"
        >
            + New Chat
        </button>


        <!-- ================= RECENT CHATS ================= -->

        <div class="recent-section">

            <button
                type="button"
                class="recent-title"
                id="recentButton"
            >

                <span id="recentArrow">
                    ▸
                </span>

                Recent Chats

            </button>


            <div
                id="historyList"
                class="history-list"
            ></div>

        </div>


        <div class="sidebar-bottom">

            <p>
                Powered by Gemini
            </p>

        </div>

    </aside>



    <!-- ================= MAIN ================= -->

    <section class="main">


        <!-- ================= HEADER ================= -->

        <header class="header">

            <div>

                <h1>
                    GenAI Assistant
                </h1>

                <p>
                    Ask anything and get an AI-powered response.
                </p>

            </div>


            <button
                type="button"
                class="theme-btn"
                id="themeButton"
            >
                🌙
            </button>

        </header>



        <!-- ================= CHAT ================= -->

        <main
            id="chatBox"
            class="chat-box"
        >

            <div class="welcome">

                <div class="robot">
                    🤖
                </div>

                <h2>
                    How can I help you?
                </h2>

                <p>
                    Ask me anything about programming,
                    AI, technology and education.
                </p>

            </div>

        </main>



        <!-- ================= INPUT ================= -->

        <div class="input-container">

            <div class="input-box">

                <input
                    type="text"
                    id="question"
                    placeholder="Message GenAI..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="sendButton"
                >
                    ➤
                </button>

            </div>


            <p class="disclaimer">

                GenAI can make mistakes.
                Check important information.

            </p>

        </div>

    </section>

</div>


<!-- ================= JAVASCRIPT ================= -->

<!-- ?v=3 forces browser to load the newest script -->

<script src="./script.js></script>

</body>


</html>
